<!doctype html>

<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f4f4f4}.app{width:min(100%,480px);margin:auto;min-height:100vh;background:#111}.screen{padding:14px}.hidden{display:none!important}.title{font-size:20px;font-weight:800}.note,.status{color:#aaa;font-size:12px;line-height:1.45}.divider{height:1px;background:#2b2b2b;margin:15px 0}.section-title,.label,.sub{font-weight:800}.section-title{margin-bottom:9px}.label{display:block;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn,.select,.input,.textarea{font:inherit;border:1px solid #3a3a3a;background:#1b1b1b;color:#fff;border-radius:11px;min-height:44px}.btn{padding:10px 12px;font-weight:700}.btn.primary,.btn.on{background:#fff;color:#111;border-color:#fff}.btn.small{min-height:39px;padding:8px 9px;font-size:13px}.btn:disabled{opacity:.45}.select,.input,.textarea{width:100%;padding:10px}.textarea{min-height:76px}.box{margin-top:11px;padding:12px;border:1px solid #2c2c2c;border-radius:12px;background:#151515}.header{display:grid;grid-template-columns:92px 1fr;gap:11px}.thumb{width:92px;height:52px;object-fit:cover;border-radius:8px;background:#222}.video-title{font-weight:800;font-size:15px;line-height:1.35;max-height:42px;overflow:hidden}.meta{margin-top:4px;color:#aaa;font-size:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.check{display:flex;gap:7px;align-items:flex-start;font-size:14px}.check input{margin-top:2px;transform:scale(1.1)}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.arrow{text-align:center;color:#777;margin:4px}.stars{display:flex;gap:5px}.star{font-size:25px;border:0;background:none;color:#777;padding:2px}.star.on{color:#fff}.duplicate{padding:12px;border:1px solid #6c5825;background:#261f10;border-radius:12px}.footer{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sp{height:11px}.drive-row{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:center;margin-top:9px}.widget{min-height:42px;display:flex;align-items:center;overflow:hidden}details{margin-top:11px;border-top:1px solid #292929;padding-top:9px}@media(max-width:350px){.checks{grid-template-columns:1fr}.header{grid-template-columns:76px 1fr}.thumb{width:76px;height:43px}}

<div class="app" id="app">
<section id="setup" class="screen">
  <div class="title">유튜브다운로드 설정</div>
  <div class="box"><div class="sub">초기화</div><div class="sp"></div><div id="setupStatus" class="status">영상 정보를 준비 중…</div><div class="sp"></div><button id="retry" class="btn" style="width:100%">다시 시도</button></div>
</section>
<section id="main" class="screen hidden">
  <div class="title">유튜브다운로드</div><div class="divider"></div>
  <div class="header"><img id="thumb" class="thumb" alt="썸네일"><div><div id="videoTitle" class="video-title">영상 제목</div><div id="videoMeta" class="meta"></div></div></div>
  <div class="divider"></div><div class="section-title">1. 가져올 항목</div><div class="grid3"><button class="btn type" data-type="video">영상</button><button class="btn type" data-type="audio">음성</button><button class="btn type" data-type="data">데이터</button></div><div class="note">복수 선택 가능</div>

  <div id="audioOptions" class="box hidden"><label class="label">음성 음질</label><select id="audioQuality" class="select"></select></div>
  <div id="dataOptions" class="box hidden"><div class="sub">기본정보</div><div class="sp"></div><div class="checks"><label class="check"><input type="checkbox" value="thumbnail" checked>썸네일</label><label class="check"><input type="checkbox" value="title" checked>제목</label><label class="check"><input type="checkbox" value="url" checked>영상 URL</label><label class="check"><input type="checkbox" value="channel" checked>채널명</label><label class="check"><input type="checkbox" value="publishedAt" checked>업로드일</label><label class="check"><input type="checkbox" value="duration" checked>영상 길이</label><label class="check"><input type="checkbox" value="views" checked>조회수</label><label class="check"><input type="checkbox" value="language" checked>영상 언어</label></div><div class="sp"></div><div class="sub">내용</div><div class="sp"></div><div class="checks"><label class="check"><input type="checkbox" value="description" checked>설명</label><label class="check"><input type="checkbox" value="tags" checked>태그 / 해시태그</label><label class="check"><input type="checkbox" value="transcript" checked>대본</label><label class="check"><input id="commentsCheck" type="checkbox" value="comments">댓글</label></div><div id="commentOptions" class="grid2 hidden" style="margin-top:10px"><select id="commentCount" class="select"><option value="50">댓글 50개</option><option value="100" selected>댓글 100개</option><option value="300">댓글 300개</option></select><select id="commentSort" class="select"><option value="top">인기순</option><option value="newest">최신순</option></select></div><details><summary>고급</summary><div class="checks" style="margin-top:10px"><label class="check"><input type="checkbox" value="likes">좋아요</label><label class="check"><input type="checkbox" value="rawCaptions">자막 원본</label><label class="check"><input type="checkbox" value="videoId">영상 ID</label><label class="check"><input type="checkbox" value="channelId">채널 ID</label><label class="check"><input type="checkbox" value="rawMetadata">원본 메타데이터</label></div></details></div>
  <div id="formatSection" class="hidden"><div class="divider"></div><div class="section-title">2. 데이터 형식</div><select id="dataFormat" class="select"><option value="original">원문</option><option value="txt">TXT</option><option value="json">JSON</option></select></div>
  <div class="divider"></div><div class="section-title">3. 저장 위치</div><div class="grid2"><button class="btn target" data-target="local">로컬</button><button class="btn target" data-target="drive">Drive</button></div><div id="localOptions" class="box hidden"><div class="note">한 종류는 파일 선택창, 여러 종류는 폴더 선택창을 사용합니다.</div></div>
  <div id="driveOptions" class="box hidden"><div id="driveData" class="hidden"><label class="label">파일</label><select id="driveFile" class="select"></select><div class="two"><button id="connectFile" class="btn small">+ 기존 파일 연결</button><button id="openFile" class="btn small">열기</button></div><div class="arrow">↓</div><label class="label">시트</label><select id="driveSheet" class="select"></select><div class="two"><button id="newSheet" class="btn small">+ 새 시트</button><button id="openSheet" class="btn small">열기</button></div><div class="arrow">↓</div><label class="label">카테고리</label><select id="driveCategory" class="select"></select><button id="newCategory" class="btn small" style="width:100%;margin-top:7px">+ 새 카테고리</button></div><div id="driveMedia" class="hidden"><div class="sub" style="margin-top:12px">Drive에 저장</div><div id="driveVideoRow" class="drive-row hidden"><b>영상</b><div id="driveVideoWidget" class="widget"></div></div><div id="driveAudioRow" class="drive-row hidden"><b>음성</b><div id="driveAudioWidget" class="widget"></div></div></div></div>
  <div id="management" class="hidden"><div class="divider"></div><div class="section-title">4. 관리정보</div><label class="label">내 태그</label><input id="myTags" class="input"><div class="sp"></div><label class="label">활용 목적</label><select id="purpose" class="select"><option value="">선택 안 함</option><option>공부</option><option>자료조사</option><option>아이디어</option><option>보관</option></select><div class="sp"></div><div class="label">중요도</div><div class="stars"><button class="star" data-star="1">☆</button><button class="star" data-star="2">☆</button><button class="star" data-star="3">☆</button><button class="star" data-star="4">☆</button><button class="star" data-star="5">☆</button></div><div class="sp"></div><label class="label">상태</label><select id="state" class="select"><option>미분석</option><option>분석중</option><option>완료</option><option>보류</option></select><div class="sp"></div><label class="label">메모</label><textarea id="memo" class="textarea"></textarea><div class="sp"></div><label class="check"><input id="aiSend" type="checkbox">AI에게 보낼 항목으로 표시</label></div>
  <div id="duplicate" class="hidden"><div class="divider"></div><div class="duplicate"><b>이미 수집된 영상입니다.</b><div class="sp"></div><button id="openExisting" class="btn" style="width:100%">기존 기록 열기</button><div class="sp"></div><label><input type="radio" name="dup" value="update" checked> 업데이트</label>&nbsp;&nbsp;<label><input type="radio" name="dup" value="new"> 새 기록 추가</label></div></div>
  <div class="divider"></div><div class="footer"><button id="save" class="btn primary">저장</button><button id="close" class="btn">닫기</button></div><div id="status" class="status">준비 중…</div>
</section>
</div>
<script>
(()=>{
const root=document.getElementById('app'),q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)],FILE='유튜브다운로드sheet_v1',SHEET='수집',CAT='기본';
let gas=null,playerP=null,playerData=null,captionP=null,state=null,sheets=[],cats=[],dup=null,driveApi=null,sheetReady=false,sheetError='',sheetSyncP=null;const media={video:new Map(),audio:new Map()},commentCache=new Map(),managementDirty=new Set(),S={configured:false,types:new Set(),target:'',priority:0,busy:false,driveMedia:{video:false,audio:false}};
try{gas=parent.__YTDL_CALL}catch{}
const pd=parent.document,pl=parent.location,pfetch=parent.fetch.bind(parent),meta=s=>pd.querySelector(s)?.content||'',vid=()=>new URLSearchParams(pl.search).get('v')||(pl.pathname.match(/^\/shorts\/([A-Za-z0-9_-]+)/)||[])[1]||'';
const LABEL={thumbnail:'썸네일',title:'제목',url:'영상 URL',channel:'채널명',publishedAt:'업로드일',duration:'영상 길이',views:'조회수',language:'영상 언어',description:'설명',tags:'태그 / 해시태그',transcript:'대본',comments:'댓글',likes:'좋아요',rawCaptions:'자막 원본',videoId:'영상 ID',channelId:'채널 ID',rawMetadata:'원본 메타데이터'};
const show=(s,on)=>q(s)?.classList.toggle('hidden',!on),status=(m,setup=false)=>(setup?q('#setupStatus'):q('#status')).textContent=m||'';
const textOf=x=>x==null?'':typeof x==='string'?x:x.simpleText!=null?String(x.simpleText):Array.isArray(x.runs)?x.runs.map(r=>r?.text||'').join(''):'';
function fmtSec(v){let n=+v||0,h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=Math.floor(n%60);return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}
function fill(sel,list,empty,selected){const e=q(sel);if(!e)return;e.replaceChildren();for(const x of Array.isArray(list)?list:[]){if(x&&typeof x==='object'&&x.selectable===false)continue;const o=document.createElement('option'),v=typeof x==='string'?x:String(x?.value??x?.id??x?.name??''),t=typeof x==='string'?x:String(x?.label??x?.name??x?.value??'');o.value=v;o.textContent=t;e.append(o)}if(!e.options.length){const o=document.createElement('option');o.value='';o.textContent=empty;e.append(o)}if(selected!=null&&[...e.options].some(o=>o.value===String(selected)))e.value=String(selected)}
function render(){show('#setup',!S.configured);show('#main',S.configured);if(!S.configured)return;const d=S.types.has('data');qa('.type').forEach(b=>b.classList.toggle('on',S.types.has(b.dataset.type)));qa('.target').forEach(b=>b.classList.toggle('on',S.target===b.dataset.target));show('#videoOptions',S.types.has('video'));show('#audioOptions',S.types.has('audio'));show('#dataOptions',d);show('#formatSection',d);show('#localOptions',S.target==='local');show('#driveOptions',S.target==='drive');show('#driveData',S.target==='drive'&&d);show('#management',S.target==='drive'&&d);show('#duplicate',!!dup);show('#driveMedia',S.target==='drive'&&(S.driveMedia.video||S.driveMedia.audio));q('#save').disabled=S.busy}
async function refreshDuplicate(fileId,sheetName){dup=null;if(fileId&&sheetName){const d=await gas('check-duplicate',{fileId,sheetName,videoId:vid()});if(d.found)dup={rows:d.rows||[]}}render();return dup}
function managementPayload(isUpdate){const values={tags:q('#myTags').value.trim(),purpose:q('#purpose').value,priority:S.priority,status:q('#state').value,memo:q('#memo').value,aiSend:q('#aiSend').checked,category:q('#driveCategory').value},management={},clearManagement=[];for(const[key,value]of Object.entries(values)){if(isUpdate&&!managementDirty.has(key))continue;const empty=value===''||value==null||(key==='priority'&&!value);if(empty){if(isUpdate)clearManagement.push(key)}else management[key]=value}return{management,clearManagement}}
async function player(){if(playerP)return playerP;const id=vid();if(!id)throw new Error('YouTube 영상 페이지에서 실행해 주세요.');playerP=pfetch('https://www.youtube.com/youtubei/v1/player',{method:'POST',credentials:'omit',headers:{'content-type':'application/json','x-youtube-client-name':'3','x-youtube-client-version':'20.10.38'},body:JSON.stringify({videoId:id,context:{client:{clientName:'ANDROID',clientVersion:'20.10.38',androidSdkVersion:30,hl:'ko',gl:'KR'}}})}).then(r=>{if(!r.ok)throw new Error('영상 정보를 가져오지 못했습니다.');return r.json()}).then(x=>(playerData=x,x)).catch(e=>{playerP=null;throw e});return playerP}
function info(p){const d=p?.videoDetails||{},th=d.thumbnail?.thumbnails||[];return{id:vid(),title:d.title||meta('meta[property="og:title"]')||pd.title.replace(/\s*-\s*YouTube\s*$/,''),channel:d.author||'',channelId:d.channelId||'',publishedAt:meta('meta[itemprop="datePublished"]')||p?.microformat?.playerMicroformatRenderer?.publishDate||'',duration:d.lengthSeconds?fmtSec(d.lengthSeconds):'',views:d.viewCount||'',thumbnail:th.at(-1)?.url||meta('meta[property="og:image"]')||''}}
function videoLanguage(p){const d=p?.videoDetails||{},m=p?.microformat?.playerMicroformatRenderer||{},fs=p?.streamingData?.adaptiveFormats||[],a=fs.find(x=>x?.audioTrack?.audioIsDefault)?.audioTrack||fs.find(x=>x?.audioTrack)?.audioTrack||{},id=String(a.id||'').match(/^([A-Za-z]{2,3})(?:[.-]|$)/),tracks=p?.captions?.playerCaptionsTracklistRenderer?.captionTracks||[];return String(d.defaultAudioLanguage||m.defaultAudioLanguage||(id&&id[1])||(tracks.length===1?tracks[0].languageCode:'')||'')}
function tagList(p){const d=p?.videoDetails||{},out=[],seen=new Set(),add=x=>{const s=String(x||'').trim();if(s&&!seen.has(s)){seen.add(s);out.push(s)}};for(const x of Array.isArray(d.keywords)?d.keywords:[])add(x);const text=[d.title,d.shortDescription,meta('meta[name="description"]')].filter(Boolean).join('\n');for(const x of text.match(/#[\p{L}\p{N}_]+/gu)||[])add(x);return out}
function mediaOptions(p){media.video.clear();media.audio.clear();const v=[],a=[],seen=new Set();let n=0;for(const f of p?.streamingData?.formats||[]){if(!f.url||!String(f.mimeType||'').startsWith('video/mp4'))continue;const label=f.qualityLabel||((f.height||'')+'p');if(seen.has(label))continue;seen.add(label);const id='v'+n++;media.video.set(id,f);v.push({value:id,label})}n=0;for(const f of [...(p?.streamingData?.adaptiveFormats||[])].filter(x=>x.url&&String(x.mimeType||'').startsWith('audio/mp4')).sort((x,y)=>(y.bitrate||0)-(x.bitrate||0))){const id='a'+n++,label=Math.round((f.bitrate||0)/1000)+' kbps';media.audio.set(id,f);a.push({value:id,label})}fill('#videoQuality',v,'가능한 영상 없음');fill('#audioQuality',a,'가능한 음성 없음')}
async function selectFile(fileId,preferred=''){const r=await gas('list-sheets',{fileId});sheets=r.sheets||[];const s=sheets.find(x=>x.selectable!==false&&x.name===preferred)||sheets.find(x=>x.selectable!==false);cats=s?((await gas('list-categories',{fileId,sheetName:s.name})).categories||[]):[];return s}
function applyDrive(fileId,sheetName,category){fill('#driveFile',(state?.files||[]).map(x=>({...x,value:x.id,label:x.name})),'파일 없음',fileId);fill('#driveSheet',sheets.filter(x=>x.selectable!==false).map(x=>({...x,value:x.name,label:x.name})),'시트 없음',sheetName);fill('#driveCategory',cats,'카테고리 없음',category);managementDirty.delete('category')}
async function sync(){await gas('create-storage',{fileName:FILE,sheetName:SHEET,category:CAT});state=await gas('get-state',{});const fileId=state.defaultFileId||state.files?.[0]?.id;if(!fileId)throw new Error('Google Sheets 저장공간을 만들지 못했습니다.');let s=await selectFile(fileId,SHEET);if(!s){await gas('create-sheet',{fileId,sheetName:SHEET});s=await selectFile(fileId,SHEET)}if(!cats.length){await gas('add-category',{fileId,sheetName:s.name,category:CAT});cats=(await gas('list-categories',{fileId,sheetName:s.name})).categories||[]}await refreshDuplicate(fileId,s.name);applyDrive(fileId,s.name,cats[0]||'');return{fileId,sheetName:s.name}}
async function ensureSheets(){if(sheetReady)return true;if(sheetSyncP)return sheetSyncP;if(!gas){sheetError='Google 연결 정보를 찾지 못했습니다.';return false}sheetSyncP=(async()=>{try{await sync();sheetReady=true;sheetError='';return true}catch(e){sheetReady=false;sheetError=e?.message||String(e);return false}finally{sheetSyncP=null}})();return sheetSyncP}
async function start(){S.configured=false;render();status('영상 정보를 준비 중…',true);try{const p=await player(),v=info(p);mediaOptions(p);q('#videoTitle').textContent=v.title;q('#videoMeta').textContent=[v.channel,v.publishedAt,v.duration,v.views].filter(Boolean).join(' · ');if(v.thumbnail)q('#thumb').src=v.thumbnail;S.configured=true;render();status('영상 준비됨 · Google Sheets 연결 중…');ensureSheets().then(ok=>{if(!S.busy)status(ok?'준비됨':'로컬/Drive 미디어 저장 가능 · Google Sheets 연결 실패: '+sheetError)})}catch(e){S.configured=false;render();status(e?.message||String(e),true)}}
function payload(){const p={types:[...S.types],target:S.target},duplicateMode=dup?(q('input[name=dup]:checked')?.value||'update'):'';if(S.types.has('video'))p.video={id:q('#videoQuality').value};if(S.types.has('audio'))p.audio={id:q('#audioQuality').value};if(S.types.has('data')){p.data={fields:qa('#dataOptions input[type=checkbox]:checked').map(x=>x.value),format:q('#dataFormat').value};if(q('#commentsCheck').checked)p.data.comments={count:+q('#commentCount').value,sort:q('#commentSort').value}}if(S.target==='drive'&&S.types.has('data')){p.drive={fileId:q('#driveFile').value,sheetName:q('#driveSheet').value,category:q('#driveCategory').value};const m=managementPayload(duplicateMode==='update');p.management=m.management;if(m.clearManagement.length)p.clearManagement=m.clearManagement}if(duplicateMode){p.duplicateMode=duplicateMode;if(duplicateMode==='update'&&dup?.rows?.[0]?.row)p.targetRow=dup.rows[0].row}return p}
function chooseCaptionTrack(p){const tracks=p?.captions?.playerCaptionsTracklistRenderer?.captionTracks||[];if(!tracks.length)return null;const score=t=>(String(t.languageCode||'').toLowerCase().startsWith('ko')?4:0)+(t.kind==='asr'?0:2)+(t.isTranslatable?1:0);return tracks.slice().sort((a,b)=>score(b)-score(a))[0]||null}
function captionUrl(track,fmt){try{const u=new URL(track.baseUrl);u.searchParams.set('fmt',fmt);return u.href}catch{return String(track.baseUrl||'')+(String(track.baseUrl||'').includes('?')?'&':'?')+'fmt='+encodeURIComponent(fmt)}}
async function fetchCaptionBundle(p){if(captionP)return captionP;captionP=(async()=>{const track=chooseCaptionTrack(p);if(!track?.baseUrl)throw new Error('사용 가능한 자막이 없습니다.');const meta={language:String(track.languageCode||''),languageName:textOf(track.name)||String(track.languageCode||''),kind:track.kind||'',isTranslatable:!!track.isTranslatable};let raw=null,segments=[];try{const r=await pfetch(captionUrl(track,'json3'),{credentials:'omit'});if(!r.ok)throw 0;raw=await r.json();for(const e of raw?.events||[]){if(!Array.isArray(e.segs))continue;const text=e.segs.map(s=>s?.utf8||'').join('').replace(/\n/g,' ').trim();if(text)segments.push({startMs:Number(e.tStartMs)||0,durationMs:Number(e.dDurationMs)||0,text})}}catch{const r=await pfetch(track.baseUrl,{credentials:'omit'});if(!r.ok)throw new Error('자막 응답을 가져오지 못했습니다.');const xml=await r.text(),doc=new DOMParser().parseFromString(xml,'text/xml');segments=[...doc.querySelectorAll('text')].map(x=>({startMs:Math.round((+x.getAttribute('start')||0)*1000),durationMs:Math.round((+x.getAttribute('dur')||0)*1000),text:(x.textContent||'').replace(/\s+/g,' ').trim()})).filter(x=>x.text);raw={segments:segments.map(x=>({...x}))}}if(!segments.length)throw new Error('자막 내용이 비어 있습니다.');return{transcript:{language:meta.language,languageName:meta.languageName,text:segments.map(x=>x.text).join(' '),segments},rawCaptions:{track:meta,events:Array.isArray(raw?.events)?raw.events:undefined,segments:raw?.segments}}})().catch(e=>{captionP=null;throw e});return captionP}
function parseCountText(s){const t=String(s||'').replace(/,/g,'').trim();const m=t.match(/([0-9]+(?:\.[0-9]+)?)\s*(억|만|천|B|M|K)?/i);if(!m)return null;let n=Number(m[1]),u=(m[2]||'').toUpperCase(),mul=u==='억'?1e8:u==='만'?1e4:u==='천'?1e3:u==='B'?1e9:u==='M'?1e6:u==='K'?1e3:1;return Number.isFinite(n)?Math.round(n*mul):null}
