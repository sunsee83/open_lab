name: Full body solo dance -> pose-guided previs (corrected sample)
on:
  push:
    branches: [temp/previs-solo-20261101]
    paths: [.github/workflows/previs-solo-20261101.yml]
permissions:
  contents: read
jobs:
  test-single-person:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public Pexels sample and extract 6s
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p input output
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --silent --show-error 'https://videos.pexels.com/video-files/6003772/6003772-hd_1920_1080_30fps.mp4' -o /tmp/pexels_sample.mp4
          test $(stat -c %s /tmp/pexels_sample.mp4) -gt 100000
          ffprobe -v error -show_entries format=duration,size -of json /tmp/pexels_sample.mp4
          ffmpeg -hide_banner -loglevel error -nostdin -y -ss 0.5 -i /tmp/pexels_sample.mp4 -t 6 -vf 'fps=12,scale=960:540:force_original_aspect_ratio=decrease,pad=960:540:(ow-iw)/2:(oh-ih)/2' -an -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p input/solo_original_6s.mp4
          ffprobe -v error -show_entries format=duration,size -of json input/solo_original_6s.mp4
      - name: Download free pose and person segmentation models
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q --disable-pip-version-check --no-cache-dir 'ultralytics>=8.3,<9'
      - name: Compare original and pose-guided mannequin
        shell: bash
        env:
          YOLO_CONFIG_DIR: /tmp/yolo_config
        run: |
          set -euo pipefail
          python -u tests/solo_previs_20261101.py
          ffmpeg -nostdin -hide_banner -loglevel error -y -i output/01_원본_실루엣_마네킹.mp4 -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p -movflags +faststart output/01_원본_실루엣_마네킹_h264.mp4
          rm -f output/01_원본_실루엣_마네킹.mp4
          mv output/01_원본_실루엣_마네킹_h264.mp4 output/01_원본_실루엣_마네킹.mp4
          cp input/solo_original_6s.mp4 output/00_샘플원본_6초.mp4
          ls -lh output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-person-previs-test-20261101
          path: output/
          if-no-files-found: warn
          retention-days: 1
