name: Hypit real SVML compositing experiment
on:
  push:
    branches: ['temp/hypit-test-20261103']
    paths: ['.github/workflows/hypit-svml-render-20261103.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install local dependencies and Hypit
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python3 -m pip install -q pillow --break-system-packages || pip3 install -q pillow
          mkdir -p /tmp/hypitcase
          cd /tmp/hypitcase
          npm init -y >/dev/null
          npm pkg set type=module
          npm pkg set --json 'hypit.project=true'
          npm install --silent @hypit/hypit@0.3.1 @hypit/fontsource @fontsource-variable/noto-sans-kr
          ./node_modules/.bin/hypit --version
      - name: Receive original video and verify its SHA256
        env:
          TEMP_DOWNLOAD_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b748-8206-9722-dc299e9e919d/raw?se=2026-11-03T02%3A24%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=5a87f022-b803-5eb3-a89c-b09ce16b6472&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A26%3A02Z&ske=2026-11-04T00%3A26%3A02Z&sks=b&skv=2026-02-06&sig=VSVmPe1tsz5ukzJ/mamwo4h%2B4GetxY8UM3Bg7YCFwxk%3D'
          EXPECTED_SHA256: 'd18ccc5a23092dacdcd4fe36af2f1c2d12fe345cdcde5d94999586227e003b64'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 90 "$TEMP_DOWNLOAD_URL" -o /tmp/hypit-source.tar.gz
          mkdir -p /tmp/hypit-source
          tar -xzf /tmp/hypit-source.tar.gz -C /tmp/hypit-source
          mkdir -p /tmp/hypitcase/assets
          find /tmp/hypit-source -name hypit-svml-original.mp4 -exec cp {} /tmp/hypitcase/assets/original.mp4 \;
          echo "$EXPECTED_SHA256  /tmp/hypitcase/assets/original.mp4" | sha256sum -c -
      - name: Generate independent visual layers and authored SVML source
        shell: bash
        run: |
          cat > /tmp/hypitcase/create.py <<'PY'
          import json, subprocess, pathlib, shutil
          from PIL import Image,ImageFont,ImageDraw
          P=pathlib.Path('/tmp/hypitcase'); A=P/'assets'
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss','0.5','-i',str(A/'original.mp4'),'-frames:v','1',str(A/'first.png')],check=True)
          source=Image.open(A/'first.png').convert('RGB')
          bg=Image.new('RGB',(360,640),(31,31,32))
          bg.paste(source.crop((0,0,360,159)),(0,0))
          bg.paste(source.crop((0,515,360,640)),(0,515))
          bg.save(A/'base.png')
          rows=json.loads('''[[0,0.78,"우리 모임에...","white"],[0.8,1.53,"최지우가..","white"],[1.55,2.08,"어느 날 왔는데","white"],[2.1,2.78,"바르래 하니 이쁘더라고","white"],[2.78,3.4,"너..!","white"],[3.4,4.63,"립밤 뭐 바른거야?!","white"],[4.64,5.11,"얘는 제가..","purple"],[5.12,5.58,"진짜","white"],[5.58,7.35,"좋아하는 아이인데","orange"],[7.35,8.3,"되게 슬림해서..","white"],[8.3,8.74,"저의","white"],[8.74,9.66,"저의 모든 가방 안에..","white"],[9.66,10.76,"하나씩 다 들어있어요","white"],[10.76,11.62,"그냥.. 투명이에요","thin"],[11.62,12.98,"되게 자연스럽게..","thin"],[12.98,14.1,"틴트 효과가 있어요","orange"],[14.1,15.02,"향이 너무 좋아요","white"],[15.02,15.98,"딸기 향이 나는 립밤","pink"],[15.98,17.03,"제가 좋아하는..","thin"],[17.03,17.68,"보면 투명색이지","white"],[17.68,18.13,"이거는","purple"],[18.13,19.1,"이거는 이렇게 바르면..","purple"],[19.1,20.13,"지금 나 봐봐!","white"],[21.23,21.67,"혈색이..","orange"],[21.67,22.5,"확 돌아보이지?!","white"]]''')
          path='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          normal='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          fontfiles={'white':path,'thin':normal,'orange':path,'purple':path,'pink':path}
          colors={'white':'#ffffff','thin':'#f5f5f5','orange':'#ff7b31','purple':'#bd6afb','pink':'#ffacb9'}
          windows=[]; declarations=[]; clips=[]
          for j,(start,end,content,style) in enumerate(rows,1):
              name='caption%02d'%j; image=Image.new('RGBA',(360,640),(0,0,0,0)); draw=ImageDraw.Draw(image)
              size=27 if len(content)>12 else 32
              font=ImageFont.truetype(fontfiles[style],size)
              bbox=draw.textbbox((0,0),content,font=font,stroke_width=2)
              tw=bbox[2]-bbox[0]
              if tw>338:
                  size=max(17,int(size*338/tw)); font=ImageFont.truetype(fontfiles[style],size)
                  bbox=draw.textbbox((0,0),content,font=font,stroke_width=2);tw=bbox[2]-bbox[0]
              x=(360-tw)//2-bbox[0]
              y=441-(bbox[3]-bbox[1])//2-bbox[1]
              draw.text((x,y),content,font=font,fill=colors[style],stroke_width=2,stroke_fill='#151515')
              image.save(A/(name+'.png'))
              s=round(start*24);e=min(540,max(s+1,round(end*24)))
              windows.append('  <time:Window id="%s-window" timeline={filmtime.timeline} from="%df" for="%df"/>'%(name,s,e-s))
              declarations.append('  <asset:Image id="%s" src="./assets/%s.png"/>'%(name,name))
              clips.append('    <visual:Clip id="%s-clip" image={%s} extent={pixel-size} during={%s-window} frame={full-frame} z="20" fit="stretch"/>'%(name,name,name))
          svml='\n'.join([
            '<?svml using="@hypit/markup@1"?>','<svml>',
            '  <import as="time" from="@hypit/timeline-author@1"/>',
            '  <import as="spatial" from="@hypit/spatial@1"/>',
            '  <import as="asset" from="@hypit/media@1"/>',
            '  <import as="mediaop" from="@hypit/media-operations@1"/>',
            '  <import as="visual" from="@hypit/visual-track@1"/>',
            '  <import as="audio" from="@hypit/audio-track@1"/>',
            '  <import as="film" from="@hypit/film@1"/>',
            '  <import as="html" from="@hypit/html-video@1"/>',
            '  <import as="look" source="./render.svs"/>',
            '  <time:Clock id="clock" frame-rate="24"/>',
            '  <time:Timeline id="filmtime" clock={clock} end="22.5s"/>',
            '  <spatial:Canvas id="canvas" width="360" height="640"/>',
            '  <spatial:Extent id="pixel-size" width="360" height="640"/>',
            '  <spatial:Frame id="full-frame" within={canvas.bounds} left="0%" top="0%" right="100%" bottom="100%"/>',
            '  <asset:Video id="original" src="./assets/original.mp4"/>',
            '  <mediaop:Normalize id="source-audio" source={original} clock={clock} video="none" audio="default" span-authority="audio"/>',
            '  <asset:Image id="base" src="./assets/base.png"/>',
            *windows,*declarations,
            '  <visual:Track id="picture" timeline={filmtime.timeline}>',
            '    <visual:Clip id="background" image={base} extent={pixel-size} during={filmtime.window} frame={full-frame} z="0" fit="stretch"/>',
            *clips,'  </visual:Track>',
            '  <audio:Track id="soundtrack" timeline={filmtime.timeline}>',
            '    <audio:Clip id="original-voice" source={source-audio.media} during={filmtime.window}/>',
            '  </audio:Track>',
            '  <film:Film id="main" canvas={canvas.canvas} timeline={filmtime.timeline} appearance={look.film.main}>',
            '    <film:Track source={picture.visual}/>',
            '    <film:Track source={soundtrack.audio}/>',
            '  </film:Film>',
            '  <html:Video id="final" composition={main.composition} timeline={filmtime.timeline}/>',
            '</svml>',''])
          (P/'render.svml').write_text(svml,encoding='utf-8')
          (P/'render.svs').write_text('<?svml using="@hypit/recipe@1"?>\n<sheet version="1">\n film.main { background: #1f1f20; }\n</sheet>\n',encoding='utf-8')
          (P/'render.svrun').write_text('<?svml using="@hypit/markup/run@1"?>\n<svrun version="1"><author source="./render.svml"/><target output="final.video"/></svrun>\n',encoding='utf-8')
          runtime={'format':'hypit.runtime-local@1','dataRoot':'.hypit/runtimes/local','endpoints':{'media.local':{'use':'@hypit/media-local','config':{'defaultConcurrency':2}},'html.local':{'use':'@hypit/provider-html-local','config':{'workers':2,'defaultConcurrency':1}}}}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if chrome: runtime['endpoints']['html.local']['config']['chromePath']=chrome
          (P/'hypit.runtime.json').write_text(json.dumps(runtime,indent=2),encoding='utf-8')
          print('SOURCE_CREATED',len(rows),'subtitle-layers', 'chrome',chrome)
          PY
          python3 /tmp/hypitcase/create.py
      - name: Validate source and render with Hypit
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/hypitcase
          export PATH="$PWD/node_modules/.bin:$PATH"
          hypit check render.svrun --project "$PWD" 2>&1 | tee /tmp/hypit-check.log
          hypit plan render.svrun --project "$PWD" --runtime hypit.runtime.json 2>&1 | tee /tmp/hypit-plan.log
          hypit programs prepare --runtime hypit.runtime.json --endpoint html.local 2>&1 | tee /tmp/hypit-prepare.log
          hypit build render.svrun --project "$PWD" --runtime hypit.runtime.json --follow 2>&1 | tee /tmp/hypit-build.log
          BUILD_ID=$(grep -oE 'bld_[A-Za-z0-9_-]+' /tmp/hypit-build.log | head -1 || true)
          echo "BUILD_ID=$BUILD_ID"
          hypit builds --project "$PWD" | tee /tmp/hypit-builds.log
          mkdir -p output
          if [ -n "$BUILD_ID" ]; then hypit get "$BUILD_ID" --output final.video --to /tmp/hypitcase/output/hypit-final.mp4 --project "$PWD"; fi
          if [ ! -f output/hypit-final.mp4 ]; then
             echo 'EXPORT_NOT_FOUND'; hypit get --help | head -90; find .hypit -type f -name '*.mp4' -print
             exit 19
          fi
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 output/hypit-final.mp4 | tee /tmp/hypit-final-probe.txt
      - name: Upload result, Sources and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-svml-real-render
          path: |
            /tmp/hypitcase/render.svml
            /tmp/hypitcase/render.svrun
            /tmp/hypitcase/render.svs
            /tmp/hypitcase/hypit.runtime.json
            /tmp/hypitcase/output/hypit-final.mp4
            /tmp/hypit-check.log
            /tmp/hypit-plan.log
            /tmp/hypit-prepare.log
            /tmp/hypit-build.log
            /tmp/hypit-builds.log
            /tmp/hypit-final-probe.txt
          retention-days: 2
          if-no-files-found: warn
