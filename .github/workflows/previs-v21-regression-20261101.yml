name: Previs 3rd mode v2.1 pipeline regression
on:
  push:
    branches: [temp/previs-auto3-integrated-20261101]
    paths: [.github/workflows/previs-v21-regression-20261101.yml]
permissions:
  contents: read
jobs:
  verify-3d-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Receive isolated new engine and public demo
        env:
          SOURCE_ARCHIVE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fd48-8206-bda0-2b93cf87d82a/raw?se=2026-10-31T18%3A34%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=7ce95bab-fc27-5d61-bc66-9f4f2dd0d36d&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T03%3A32%3A29Z&ske=2026-11-01T03%3A32%3A29Z&sks=b&skv=2026-02-06&sig=ydvATWaV9UUUjWTUMI37ggkriRjBfKoWUeQW69ENUQs%3D"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming input work out
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 --silent --show-error "$SOURCE_ARCHIVE_URL" -o incoming/plugin.tar.gz
          tar -xzf incoming/plugin.tar.gz -C incoming
          for name in analyze_v2.py render_v2.py assemble_v2.py contact_v21.py motion_v21.py quality_v21.py run_v21.py test_v21.py; do
            cp "incoming/skills/actions-video-transfer/assets/$name" "work/$name"
            python3 -m py_compile "work/$name"
          done
          cp incoming/skills/actions-video-transfer/assets/test_video.mp4 input/source.mp4
          cp incoming/skills/actions-video-transfer/assets/test_pose.json input/pose.json
          test $(stat -c %s input/source.mp4) -gt 100000
          echo "RECEIVED_RUNNABLE_V21_ENGINE"
      - name: Install free image and 3D video dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy python3-scipy python3-opencv ffmpeg blender xvfb xauth libegl1 libgl1 libgl1-mesa-dri >/dev/null
          /usr/bin/python3 -c 'import cv2,numpy,scipy; print("CV2_SCIPY",cv2.__version__)'
          blender --version | head -1
      - name: Run eight isolated negative and positive regression cases
        shell: bash
        run: |
          set -euo pipefail
          cd work
          /usr/bin/python3 -m unittest test_v21 -v
      - name: Run full automated source to real Blender to mobile MP4
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$(pwd)/work:/usr/lib/python3/dist-packages" xvfb-run -a /usr/bin/python3 work/run_v21.py --video input/source.mp4 --pose-json input/pose.json --fps 8 --out out
          /usr/bin/python3 - <<'PY'
          import json,os
          d=json.load(open('out/pipeline_status.json'))
          assert d['status'] in ('NEEDS_REVIEW','VERIFIED'),d
          assert d['output_available'] is True
          assert os.path.getsize('out/mobile_comparison_h264.mp4')>50000
          q=json.load(open('out/blender_qc.json'))
          assert q['result']=='PASS' and q['hidden_when_unobserved'] and q['projection_evaluation_samples']>100
          print('V21_END_TO_END_PASS',d,'blender_samples',q['projection_evaluation_samples'])
          PY
          ffprobe -v error -show_entries stream=width,height,nb_frames -show_entries format=duration -of json out/mobile_comparison_h264.mp4
          cp out/mobile_comparison_h264.mp4 out/v21_review_for_phone.mp4
          rm -f out/front_*.png out/side_*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previs-v21-actual-render-and-audit
          path: |
            out/*.mp4
            out/*.json
            out/*.jpg
            out/*.blend
          retention-days: 1
          if-no-files-found: warn
