name: Hypit editable reference reconstruction complete test
on:
  push:
    branches: ['temp/hypit-test-20261103']
    paths: ['.github/workflows/hypit-full-editable-20261103.yml']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Download original and editable project in temporary archive
        env:
          TRANSFER_ARCHIVE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-194c-8206-a060-19405b8b9618/raw?se=2026-11-03T09%3A01%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=93cf6499-63b7-5d9b-b8e8-ce34d97df94c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T00%3A28%3A47Z&ske=2026-11-04T00%3A28%3A47Z&sks=b&skv=2026-02-06&sig=q%2BPggNw%2BFEIh8r3UPcSKFPat6qcDE3xKfsLmc0uFbqA%3D'
          EXPECTED_ARCHIVE_SHA: '85d66292a277a80e0f88056df776d7271ec11817e1b1a4d3f07edbc433947630'
          EXPECTED_VIDEO_SHA: 'd18ccc5a23092dacdcd4fe36af2f1c2d12fe345cdcde5d94999586227e003b64'
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 110 "$TRANSFER_ARCHIVE_URL" -o /tmp/transport.tar.gz
          mkdir -p /tmp/hypit-transport
          tar -xzf /tmp/transport.tar.gz -C /tmp/hypit-transport
          INPUT=$(find /tmp/hypit-transport -type f -name 'hypit-full-pipeline.tar.gz' -print -quit)
          test -n "$INPUT"
          echo "$EXPECTED_ARCHIVE_SHA  $INPUT" | sha256sum -c -
          tar -xzf "$INPUT" -C /tmp
          echo "$EXPECTED_VIDEO_SHA  /tmp/hypit-project/assets/reference.mp4" | sha256sum -c -
          echo "ORIGINAL_TRANSFER_VERIFIED"
          sed -i 's/align="left"/align="start"/g' /tmp/hypit-project/*.svml
          python3 - <<'PYCODE'
          from pathlib import Path
          f=Path('/tmp/hypit-project/editable_swapped.svml')
          s=f.read_text()
          line=next(x for x in s.splitlines() if 'id="replacement-footage"' in x)
          s=s.replace(line+'\n','',1)
          token='  </visual:Track>\n  <audio:Track id="audio-mix"'
          assert token in s
          s=s.replace(token,'  </visual:Track>\n  <visual:Track id="replacement-track" timeline={filmtime.timeline}>\n'+line+'\n  </visual:Track>\n  <audio:Track id="audio-mix"',1)
          s=s.replace('    <film:Track source={picture.visual}/>','    <film:Track source={picture.visual}/>\n    <film:Track source={replacement-track.visual}/>',1)
          s=s.replace('id="cue06-text">립밤 뭐 바른거야?!','id="cue06-text">원하는 글자로 변경!',1)
          f.write_text(s)
          PYCODE
      - name: Install Hypit distribution, fonts and media tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd /tmp/hypit-project
          npm install --no-audit --no-fund --silent
          npx hypit --version
          python3 - <<'PY'
          import json,shutil,pathlib
          p=pathlib.Path('hypit.runtime.json')
          v=json.loads(p.read_text())
          exe=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if exe: v['endpoints']['html.local']['config']['chromePath']=exe
          p.write_text(json.dumps(v,indent=2))
          print('RENDER_BROWSER',exe)
          PY
      - name: Hypit parse-check plan, browser preparation and renders
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/hypit-project
          export PATH="$PWD/node_modules/.bin:$PATH"
          mkdir -p outputs /tmp/hypit-report
          hypit check editable_empty.svrun --project "$PWD" 2>&1 | tee /tmp/hypit-report/check-empty.txt
          hypit check editable_swapped.svrun --project "$PWD" 2>&1 | tee /tmp/hypit-report/check-swapped.txt
          hypit plan editable_empty.svrun --runtime hypit.runtime.json --project "$PWD" 2>&1 | tee /tmp/hypit-report/plan-empty.txt
          hypit plan editable_swapped.svrun --runtime hypit.runtime.json --project "$PWD" 2>&1 | tee /tmp/hypit-report/plan-swapped.txt
          hypit programs prepare --runtime hypit.runtime.json --endpoint html.local --project "$PWD" 2>&1 | tee /tmp/hypit-report/prepare.txt
          for variant in empty swapped; do
            echo "RENDERING $variant"
            hypit build "editable_$variant.svrun" --project "$PWD" --runtime hypit.runtime.json --follow 2>&1 | tee "/tmp/hypit-report/build-$variant.txt"
            BUILD_ID=$(grep -oE 'bld_[A-Za-z0-9_-]+' "/tmp/hypit-report/build-$variant.txt" | head -1)
            test -n "$BUILD_ID"
            hypit get "$BUILD_ID" --output final.video --project "$PWD" --to "outputs/$variant.mp4" | tee "/tmp/hypit-report/get-$variant.txt"
            ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of json "outputs/$variant.mp4" >"/tmp/hypit-report/probe-$variant.json"
            test -s "outputs/$variant.mp4"
          done
          sha256sum outputs/*.mp4 | tee /tmp/hypit-report/output-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/hypit-project')
          a=(p/'editable_empty.svml').read_text()
          b=(p/'editable_swapped.svml').read_text()
          assert a.count('<typo:Flow')>=28 and b.count('<typo:Flow')>=28
          assert '원하는 글자로 변경!' in b and '원하는 글자로 변경!' not in a
          assert 'replacement-footage' in b and 'replacement-footage' not in a
          assert 'independent-test-effect' in b and 'independent-test-effect' not in a
          print('EDITABLE_TEXT_AND_INDEPENDENT_VISUAL_AUDIO_COMPOSITION_VERIFIED')
          PY
      - name: Upload MP4 variants, editable sources, evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-full-editable-test
          if-no-files-found: warn
          retention-days: 2
          path: |
            /tmp/hypit-project/outputs/*.mp4
            /tmp/hypit-project/*.svml
            /tmp/hypit-project/*.svrun
            /tmp/hypit-project/*.svs
            /tmp/hypit-project/README.md
            /tmp/hypit-project/ANALYSIS.md
            /tmp/hypit-project/TIMELINE.md
            /tmp/hypit-report/
