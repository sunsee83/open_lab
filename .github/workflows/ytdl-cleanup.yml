name: YouTube Downloader Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ytdl-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean and validate YouTube downloader code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('bookmarklets/youtube')
          code_p = root / 'apps-script' / 'Code.gs'
          transport_p = root / 'apps-script' / 'Transport.gs'
          ui_p = root / 'ui.html'
          bm_p = root / 'bookmarklet.js'

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          code = code_p.read_text(encoding='utf-8')
          code = one(code, "VERSION: '0.4.2'", "VERSION: '0.4.3'", 'version')
          code, n = re.subn(r"\n  ORIGINS: Object\.freeze\(\[.*?\n  \]\),", '', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ORIGINS block not found')
          code, n = re.subn(r"\nfunction doGet\(e\) \{.*?\n\}\n\nfunction dispatch", '\nfunction dispatch', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('doGet block not found')
          code = one(code, "      case 'get-state': return ok_(publicState_());\n", "      case 'get-state': return ok_(publicState_());\n      case 'create-storage': return ok_(bridgeCreateStorage_(payload));\n", 'create-storage dispatch')
          marker = "const MANAGEMENT_COLUMNS_ = Object.freeze({\n"
          start = code.index(marker)
          end = code.index("\n});", start) + 4
          header_index = "\n\nconst HEADER_INDEX_ = Object.freeze(APP_.HEADERS.reduce(function (map, header, index) {\n  map[header] = index;\n  return map;\n}, {}));"
          code = code[:end] + header_index + code[end:]
          code = code.replace('indexes_()', 'HEADER_INDEX_')
          code, n = re.subn(r"\nfunction indexes_\(\) \{.*?\n\}", '', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('indexes_ function not found')
          code = code.replace('Object.prototype.hasOwnProperty.call(', 'hasOwn_(')
          code = one(code, "function plain_(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }\n", "function plain_(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }\nfunction hasOwn_(object, key) { return Object.prototype.hasOwnProperty.call(object, key); }\n", 'hasOwn helper')
          code = one(code, '  return row.map(safe_);\n}', '  return row;\n}', 'buildRow return')
          code = one(code, '  return safe_(out);\n}\n\nfunction managementValue_', '  return out;\n}\n\nfunction managementValue_', 'serialize return')
          code = one(code, '  return safe_(out);\n}\n\nfunction noteTruncation_', '  return out;\n}\n\nfunction noteTruncation_', 'management return')
          code, n = re.subn(r"\nfunction ensureCategoryGroup_\(fileId, sheetName\) \{.*?\n\}", '', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ensureCategoryGroup_ not found')
          code, n = re.subn(r"\nfunction allowedOrigin_\(value\) \{.*?\nfunction sessionToken_\(value\) \{.*?\n", '\n', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('transport validators not found in Code.gs')
          code, n = re.subn(r"\nfunction authReadyHtml_\(\) \{.*?\n\}\s*$", '\n', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('authReadyHtml_ not found')

          new_guide = r'''function ensureGuide_(ss) {
  let sheet = ss.getSheetByName(APP_.GUIDE_NAME);
  let created = false;
  if (!sheet) {
    try { sheet = ss.insertSheet(APP_.GUIDE_NAME, 0); created = true; }
    catch (e) { fail_('FILE_NOT_WRITABLE', '안내 시트를 만들 수 없습니다.'); }
  } else {
    const title = String(sheet.getRange('A1').getDisplayValue() || '').trim();
    if (title && title !== APP_.GUIDE_TITLE && title !== 'YouTube 수집도구 안내') {
      fail_('GUIDE_CONFLICT', '기존 안내 탭을 보호하기 위해 연결을 중단했습니다.');
    }
  }

  const versionLabel = '도구 버전: ' + APP_.VERSION;
  const currentTitle = String(sheet.getRange('A1').getDisplayValue() || '').trim();
  const currentVersion = String(sheet.getRange('A19').getDisplayValue() || '').trim();
  if (created || currentTitle !== APP_.GUIDE_TITLE || currentVersion !== versionLabel) {
    const rows = [
      [APP_.GUIDE_TITLE], [''],
      ['저장 경로'], ['YouTube → 유튜브다운로드 → Apps Script → 이 파일 → 선택한 데이터 시트'], [''],
      ['데이터 구조'], ['• 가로 = 항목, 세로 = 영상 / 한 영상 = 한 행'], [''],
      ['제한'], ['• 안내 1개 + 데이터 시트 최대 10개'], ['• 시트당 최대 2,000개 / 1,800개부터 새 시트 권장'], ['• 2,000개부터 신규 추가 중지, 기존 기록 수정 가능'], [''],
      ['기본 규칙'], ['• 영상 ID로 중복 확인'], ['• 수집 실패 항목과 사용자 관리값은 기존값 보존'], ['• 수집일 유지 / 수정일 자동 갱신'], ['• 도구는 파일·시트·행을 자동 삭제하지 않음'],
      [versionLabel]
    ];
    const clearRows = Math.max(rows.length, Math.min(sheet.getMaxRows(), 40));
    sheet.getRange(1, 1, clearRows, 1).clearContent();
    sheet.getRange(1, 1, rows.length, 1).setValues(rows).setWrap(true).setVerticalAlignment('top');
    ['A1', 'A3', 'A6', 'A9', 'A14'].forEach(function (a1) { sheet.getRange(a1).setFontWeight('bold'); });
    sheet.getRange('A1').setFontSize(16);
    sheet.setColumnWidth(1, 700);
    sheet.setFrozenRows(1);
    sheet.setHiddenGridlines(true);
  }
  ensureGuideCategoryMeta_(sheet);
  try { sheet.hideColumns(3, 2); } catch (e) {}
  if (created || sheet.getIndex() !== 1) {
    try { ss.setActiveSheet(sheet); ss.moveActiveSheet(1); }
    catch (e) { fail_('FILE_NOT_WRITABLE', '안내 시트를 첫 번째로 이동할 수 없습니다.'); }
  }
  return sheet;
}'''
          code, n = re.subn(r"function ensureGuide_\(ss\) \{.*?\n\}\n\nfunction ensureGuideCategoryMeta_", new_guide + '\n\nfunction ensureGuideCategoryMeta_', code, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ensureGuide_ block not found')
          code_p.write_text(code.rstrip() + '\n', encoding='utf-8')

          transport = r'''/* 유튜브다운로드 - Apps Script bridge */

const BRIDGE_ORIGINS_ = Object.freeze([
  'https://www.youtube.com',
  'https://m.youtube.com',
  'https://youtube.com',
  'https://music.youtube.com'
]);

function doGet(e) {
  const p = e && e.parameter ? e.parameter : {};
  if (String(p.mode || '') !== 'bridge') {
    return HtmlService.createHtmlOutput(infoPageHtml_(
      'Google 승인 완료',
      '이 페이지를 닫고 YouTube로 돌아가 유튜브다운로드를 다시 실행해 주세요.'
    )).setTitle('유튜브다운로드 - Google 승인');
  }

  const origin = allowedOrigin_(p.origin);
  const token = sessionToken_(p.token);
  if (!origin || !token) return bridgeOutput_(infoPageHtml_('유튜브다운로드', '연결 정보가 올바르지 않습니다.'));

  try {
    return bridgeOutput_(bridgeTopHtml_(origin, token));
  } catch (err) {
    return bridgeOutput_(infoPageHtml_('유튜브다운로드', '유튜브다운로드 연결 페이지를 만들지 못했습니다.'));
  }
}

function bridgeOutput_(html) {
  return HtmlService.createHtmlOutput(html)
    .setTitle('유튜브다운로드 - Google 연결')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}

function bridgeTopHtml_(origin, token) {
  const ui = HtmlService.createHtmlOutputFromFile('ui').getContent();
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>body{margin:0;background:#111;color:#eee;font:15px/1.5 system-ui;padding:24px}.box{max-width:520px;margin:auto;padding:18px;border:1px solid #333;border-radius:14px;background:#181818}.sub{margin-top:8px;color:#aaa;font-size:13px}</style>' +
    '</head><body><div class="box"><b>유튜브다운로드 · Google 연결</b><div id="s" class="sub">YouTube와 연결 중…</div></div>' +
    '<script>(function(){"use strict";const O=' + jsLiteral_(origin) + ',T=' + jsLiteral_(token) + ',H=' + jsLiteral_(ui) + ',S=document.getElementById("s"),OP=(function(){try{return window.top.opener}catch(e){return null}})();' +
    'function post(m){try{if(OP&&!OP.closed)OP.postMessage(m,O)}catch(e){}}' +
    'window.addEventListener("message",function(e){if(e.source!==OP||e.origin!==O)return;const m=e.data;if(!m||m.token!==T)return;' +
    'if(m.type==="YTDL_BRIDGE_CLOSE"){try{window.top.close()}catch(x){}return}' +
    'if(m.type!=="YTDL_BRIDGE_REQUEST"||typeof m.id!=="string")return;' +
    'google.script.run.withSuccessHandler(function(r){if(r&&r.ok)post({type:"YTDL_BRIDGE_RESPONSE",token:T,id:m.id,ok:true,data:r.data});else post({type:"YTDL_BRIDGE_RESPONSE",token:T,id:m.id,ok:false,error:r&&r.error||{message:"Google 요청 실패"}})}).withFailureHandler(function(x){post({type:"YTDL_BRIDGE_RESPONSE",token:T,id:m.id,ok:false,error:{message:x&&x.message||"Google 요청 실패"}})}).dispatch(m.request);' +
    '});' +
    'if(!OP){S.textContent="YouTube 연결 창을 찾지 못했습니다. 이 탭을 닫고 YouTube에서 다시 실행해 주세요.";return}' +
    'post({type:"YTDL_BRIDGE_READY",token:T,html:H});S.textContent="연결 완료 · YouTube 화면으로 돌아가세요.";try{OP.focus()}catch(e){}' +
    '})();<\/script></body></html>';
}

function bridgeCreateStorage_(p) {
  const state = loadState_();
  const fileName = trim_(p.fileName || '유튜브다운로드sheet_v1', 120) || '유튜브다운로드sheet_v1';
  const sheetName = dataSheetName_(p.sheetName || '수집');
  const category = trim_(p.category || '기본', 60) || '기본';

  if (state.files.length) {
    const fileId = state.defaultFileId || state.files[0].id;
    try {
      const ss = SpreadsheetApp.openById(fileId);
      if (ss.getName() === 'YouTube 수집' && fileName === '유튜브다운로드sheet_v1') ss.rename(fileName);
      refreshFileName_(fileId, ss.getName());
    } catch (err) {}
    return { created: false, state: publicState_() };
  }

  let ss;
  try {
    ss = SpreadsheetApp.create(fileName);
    const first = ss.getSheets()[0];
    first.setName(sheetName);
    initDataSheet_(first);
  } catch (err) {
    fail_('FILE_NOT_WRITABLE', 'Google Sheets 파일을 자동으로 만들 수 없습니다.');
  }

  const connected = connectFile_({ sheetUrl: ss.getUrl() });
  const categories = addCategory_({
    fileId: connected.file.id,
    sheetName: sheetName,
    category: category
  }).categories;

  return {
    created: true,
    file: connected.file,
    sheets: connected.sheets,
    sheetName: sheetName,
    categories: categories,
    state: publicState_()
  };
}

function allowedOrigin_(value) {
  const origin = String(value || '').trim();
  return BRIDGE_ORIGINS_.indexOf(origin) >= 0 ? origin : '';
}

function sessionToken_(value) {
  const token = String(value || '').trim();
  return /^[A-Za-z0-9_-]{16,128}$/.test(token) ? token : '';
}

function infoPageHtml_(heading, message) {
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>body{margin:0;background:#111;color:#eee;font:15px/1.5 system-ui;padding:24px}.box{max-width:520px;margin:auto;padding:18px;border:1px solid #333;border-radius:14px;background:#181818}h1{font-size:18px;margin:0 0 8px}</style>' +
    '</head><body><div class="box"><h1>' + htmlEscape_(heading) + '</h1><div>' + htmlEscape_(message) + '</div></div></body></html>';
}

function htmlEscape_(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function jsLiteral_(value) {
  return JSON.stringify(value)
    .replace(/</g, '\\u003c')
    .replace(/>/g, '\\u003e')
    .replace(/&/g, '\\u0026')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}
'''
          transport_p.write_text(transport, encoding='utf-8')

          ui = ui_p.read_text(encoding='utf-8')
          old_setup = '<div class="box"><div class="sub">Google 저장공간 준비</div><div class="sp"></div><div class="note">처음 사용하는 계정은 Google 승인이 필요합니다. 승인 후 <b>유튜브다운로드sheet_v1</b>을 자동으로 만듭니다.</div><div class="sp"></div><button id="googleConnect" class="btn primary" style="width:100%">Google 승인 창 열기</button><div class="sp"></div><button id="retry" class="btn" style="width:100%">다시 연결</button><div id="setupStatus" class="status">연결 확인 중…</div></div>'
          new_setup = '<div class="box"><div class="sub">초기화</div><div class="sp"></div><div id="setupStatus" class="status">Google 저장공간과 영상 정보를 준비 중…</div><div class="sp"></div><button id="retry" class="btn" style="width:100%">다시 시도</button></div>'
          ui = one(ui, old_setup, new_setup, 'setup UI')
          ui = one(ui, "let gas=null,WEBAPP='',playerP=null", "let gas=null,playerP=null", 'WEBAPP variable')
          ui = one(ui, "try{gas=parent.__YTDL_CALL;WEBAPP=parent.__YTDL_WEBAPP_URL||''}catch{}", "try{gas=parent.__YTDL_CALL}catch{}", 'WEBAPP init')
          ui = one(ui, "q('#googleConnect').onclick=()=>parent.open(WEBAPP+'?origin='+encodeURIComponent(pl.origin)+'&token='+encodeURIComponent(parent.__YTDL_TOKEN||''),'ytGasAuth');q('#retry').onclick=start;", "q('#retry').onclick=start;", 'legacy approval button')
          ui_p.write_text(ui, encoding='utf-8')

          bm = bm_p.read_text(encoding='utf-8').strip()
          bm, n = re.subn(r",R='b'\+Date\.now\(\)\.toString\(36\)\+Math\.random\(\)\.toString\(36\)\.slice\(2\)", '', bm, count=1)
          if n != 1:
              raise SystemExit('bookmarklet requestId variable not found')
          bm = one(bm, "+'&requestId='+encodeURIComponent(R)", '', 'bookmarklet requestId query')
          bm = one(bm, "let B=null,O='',Q=null,V='',S=null,D=0,I=0;", "let B=null,O='',Q=null,V='',S=null,I=0;", 'bookmarklet D state')
          bm = one(bm, "x=()=>{D=1;removeEventListener", "x=()=>{removeEventListener", 'bookmarklet close state')
          bm = one(bm, "['__YTDL_CALL','__YTDL_TOKEN','__YTDL_WEBAPP_URL','__YTDL_CLOSE']", "['__YTDL_CALL','__YTDL_TOKEN','__YTDL_CLOSE']", 'bookmarklet cleanup keys')
          bm = one(bm, "window.__YTDL_TOKEN=T;window.__YTDL_WEBAPP_URL=U;", "window.__YTDL_TOKEN=T;", 'bookmarklet webapp global')
          bm = one(bm, "if(!D&&!B)b(", "if(!B)b(", 'bookmarklet timeout state')
          bm_p.write_text(bm + '\n', encoding='utf-8')

          stale = {
              'Code.gs doGet': 'function doGet' in code,
              'Code.gs ORIGINS': 'ORIGINS:' in code,
              'Transport doPost': 'function doPost' in transport,
              'Transport requestId': 'requestId' in transport,
              'Transport get-ui': "'get-ui'" in transport,
              'UI googleConnect': 'googleConnect' in ui,
              'UI WEBAPP': '__YTDL_WEBAPP_URL' in ui,
              'bookmarklet requestId': 'requestId' in bm,
              'bookmarklet WEBAPP global': '__YTDL_WEBAPP_URL' in bm,
          }
          bad = [k for k, v in stale.items() if v]
          if bad:
              raise SystemExit('stale code remains: ' + ', '.join(bad))
          PY

          cat bookmarklets/youtube/apps-script/Code.gs bookmarklets/youtube/apps-script/Transport.gs > /tmp/ytdl-apps-script.js
          node --check /tmp/ytdl-apps-script.js
          node --check bookmarklets/youtube/bookmarklet.js

          python3 - <<'PY'
          from pathlib import Path
          ui = Path('bookmarklets/youtube/ui.html').read_text(encoding='utf-8')
          start = ui.index('<script>') + len('<script>')
          end = ui.rindex('</script>')
          Path('/tmp/ytdl-ui.js').write_text(ui[start:end], encoding='utf-8')
          bm = Path('bookmarklets/youtube/bookmarklet.js').read_text(encoding='utf-8').strip()
          if len(bm) > 5000:
              raise SystemExit(f'bookmarklet too long: {len(bm)} chars')
          print('bookmarklet chars:', len(bm))
          print('bookmarklet bytes:', len(bm.encode('utf-8')))
          PY
          node --check /tmp/ytdl-ui.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bookmarklets/youtube/apps-script/Code.gs bookmarklets/youtube/apps-script/Transport.gs bookmarklets/youtube/ui.html bookmarklets/youtube/bookmarklet.js
          git commit -m 'Clean YouTube downloader bridge and Apps Script code'
          git pull --rebase origin main
          git push
