name: YouTube Downloader Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ytdl-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cleanup
        run: python3 tools/ytdl_cleanup_once.py

      - name: Syntax and size checks
        shell: bash
        run: |
          cat bookmarklets/youtube/apps-script/Code.gs bookmarklets/youtube/apps-script/Transport.gs > /tmp/ytdl-apps-script.js
          node --check /tmp/ytdl-apps-script.js
          node --check bookmarklets/youtube/bookmarklet.js
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('bookmarklets/youtube/ui.html').read_text(encoding='utf-8')
          start = ui.index('<script>') + len('<script>')
          end = ui.rindex('</script>')
          Path('/tmp/ytdl-ui.js').write_text(ui[start:end], encoding='utf-8')
          bm = Path('bookmarklets/youtube/bookmarklet.js').read_text(encoding='utf-8').strip()
          if len(bm) > 5000:
              raise SystemExit(f'bookmarklet too long: {len(bm)} chars')
          print('bookmarklet chars:', len(bm))
          print('bookmarklet bytes:', len(bm.encode('utf-8')))
          PY
          node --check /tmp/ytdl-ui.js
          test "$(grep -R "function doGet" -n bookmarklets/youtube/apps-script | wc -l)" -eq 1
          ! grep -R "function doPost\|requestId\|'get-ui'\|__YTDL_WEBAPP_URL\|googleConnect" bookmarklets/youtube/apps-script bookmarklets/youtube/ui.html bookmarklets/youtube/bookmarklet.js

      - name: Commit cleanup and remove one-shot tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bookmarklets/youtube/apps-script/Code.gs bookmarklets/youtube/apps-script/Transport.gs bookmarklets/youtube/ui.html bookmarklets/youtube/bookmarklet.js
          git rm tools/ytdl_cleanup_once.py .github/workflows/ytdl-cleanup.yml
          git commit -m 'Refactor YouTube downloader runtime'
          git pull --rebase origin main
          git push
