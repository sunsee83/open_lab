name: Fix YouTube Code Syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ytdl-code-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix missing brace and syntax-check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bookmarklets/youtube/apps-script/Code.gs')
          s = p.read_text(encoding='utf-8')
          old = "try { range.setRichTextValue(SpreadsheetApp.newRichTextValue().setText(String(label)).setLinkUrl(url).build());\n  catch (e)"
          new = "try { range.setRichTextValue(SpreadsheetApp.newRichTextValue().setText(String(label)).setLinkUrl(url).build()); }\n  catch (e)"
          if old not in s:
              raise SystemExit('target syntax defect not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cp bookmarklets/youtube/apps-script/Code.gs /tmp/ytdl-Code.js
          node --check /tmp/ytdl-Code.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bookmarklets/youtube/apps-script/Code.gs
          git commit -m 'Fix Apps Script Code.gs syntax'
          git pull --rebase origin main
          git push
