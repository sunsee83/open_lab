name: Diagnose Blender v2 unexpected world-to-camera projection errors
on:
  push:
    branches: [temp/previs-auto3-integrated-20261101]
    paths: [.github/workflows/previs-v2-diagnose-projector.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Recover failed quality-gated output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 41227698892 --repo "$GITHUB_REPOSITORY" -n auto3-v2-batch-qa -D source
          test -s source/editable_3d_v2.blend
          test -s source/scene_v2.json
      - name: Install Blender with headless support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb xauth libegl1 libgl1 libgl1-mesa-dri >/dev/null
      - name: Diagnose actual projection on every sampled frame
        shell: bash
        run: |
          cat > diagnose.py <<'PY'
          import bpy,json,math
          from mathutils import Vector
          from bpy_extras.object_utils import world_to_camera_view
          bpy.ops.wm.open_mainfile(filepath='source/editable_3d_v2.blend')
          sc=bpy.context.scene;spec=json.load(open('source/scene_v2.json'));cam=bpy.data.objects['camera_original_frustum']
          W=spec['meta']['width'];H=spec['meta']['height'];AR=W/H;span=3.5
          bad=[]
          for i,(key,people) in enumerate(zip(spec['cameras'],spec['people']),1):
              sc.frame_set(i);sc.view_layers.update()
              zf=max(.55,float(key['zoom']));panx=key['pan_x_px'];pany=key['pan_y_px']
              expected_cx=panx*span/H;expected_cz=1-pany*span/H
              for p in people:
                  for j in [0,11,12,13,14,15,16,23,24,25,26,27,28,31,32]:
                      u,v,_=p['screen_xyz'][j]
                      world=Vector((expected_cx+(u-.5)*span*AR/zf,0,expected_cz+(.5-v)*span/zf))
                      q=world_to_camera_view(sc,cam,world)
                      err=max(abs(q.x-u),abs(q.y-(1-v)))
                      if err>.025:bad.append([round(err,5),i,j,round(u,3),round(v,3),round(q.x,4),round(q.y,4),round(expected_cx,4),round(cam.location.x,4),round(cam.data.ortho_scale,4),round(span*AR/zf,4)])
          bad.sort(reverse=True)
          print('PROJECTION_FAILURE_COUNT',len(bad))
          for b in bad[:35]:print('PROJECTION_FAIL',b)
          PY
          xvfb-run -a blender -b -t 2 --python diagnose.py
