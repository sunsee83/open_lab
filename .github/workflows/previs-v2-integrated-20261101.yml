name: Auto3 v2 integrated source-camera-3D-quality test
on:
  push:
    branches: [temp/previs-auto3-integrated-20261101]
    paths: [.github/workflows/previs-v2-integrated-20261101.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Receive v2 engine, verified reference video and reference pose
        env:
          ARCHIVE: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-8168-8206-aadf-2c3f4b006925/raw?se=2026-10-31T18%3A14%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=9202cb6f-5592-52d9-9831-4e710e8749f2&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T01%3A51%3A36Z&ske=2026-11-01T01%3A51%3A36Z&sks=b&skv=2026-02-06&sig=B7vACiISh4J%2BWWsp8waM7Nd%2BUOSfWGpD3NrgDKUr/AM%3D"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/incoming input out
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --silent --show-error "$ARCHIVE" -o /tmp/incoming/upload.tar.gz
          tar -xzf /tmp/incoming/upload.tar.gz -C /tmp/incoming
          for filename in analyze_v2.py render_v2.py assemble_v2.py; do
            cp "/tmp/incoming/skills/actions-video-transfer/assets/$filename" "$filename"
            python3 -m py_compile "$filename"
          done
          cp /tmp/incoming/skills/actions-video-transfer/assets/test_video.mp4 input/source.mp4
          cp /tmp/incoming/skills/actions-video-transfer/assets/test_pose.json input/pose.json
          test $(stat -c %s input/source.mp4) -gt 500000
          echo "DATA_AND_CODE_OK"
      - name: Install OpenCV Scipy Blender FFmpeg and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-opencv python3-numpy python3-scipy blender ffmpeg xvfb xauth libegl1 libgl1 libgl1-mesa-dri >/dev/null
          /usr/bin/python3 -c 'import cv2,numpy,scipy;print("CV2_SCIPY_OK",cv2.__version__)'
          blender --version | head -1
      - name: Analyze source imagery shots camera and actor trajectories
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 analyze_v2.py --video input/source.mp4 --pose-json input/pose.json --fps 8 --out out
          /usr/bin/python3 - <<'PY'
          import json
          d=json.load(open('out/scene_v2.json'));qc=json.load(open('out/analysis_qc.json'))
          assert len(d['shots'])==2 and len(d['people'])==48
          assert abs(d['cuts_seconds'][0]-3.0)<.14
          assert len(qc['people_ids'])==1 and qc['camera_measured_frames']>=42
          assert all('background_proxy' in s for s in d['shots'])
          print('V2_ANALYSIS_QC',qc)
          PY
      - name: Render calibrated articulated 3D Blender actors and moving cameras
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python render_v2.py -- out/scene_v2.json out
          python3 - <<'PY'
          import json
          d=json.load(open('out/blender_qc.json'))
          assert d['result']=='PASS' and d['projection_evaluation_samples']>500,d
          print('V2_3D_QC',d)
          PY
      - name: Composite genuine background proxy without invented stage and inspect MP4
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 assemble_v2.py --scene out/scene_v2.json --source input/source.mp4 --renders out --out out/v2_raw.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -i out/v2_raw.mp4 -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p -movflags +faststart out/v2_mobile_comparison.mp4
          python3 - <<'PY'
          import subprocess,json
          v=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height,nb_frames','-show_entries','format=duration','-of','json','out/v2_mobile_comparison.mp4']))
          s=v['streams'][0]
          assert s['codec_name']=='h264' and (s['width'],s['height'])==(640,1080) and abs(float(v['format']['duration'])-6)<.2
          print('PHONE_VIDEO_QC_PASS',v)
          PY
          rm -f out/front_*.png out/side_*.png out/v2_raw.mp4
          ls -lh out/v2_mobile_comparison.mp4 out/editable_3d_v2.blend out/mobile_contact_sheet.jpg out/blender_qc.json
      - name: Publish directly downloadable MP4 for mobile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create previs-auto3-v2-20261101 out/v2_mobile_comparison.mp4 out/mobile_contact_sheet.jpg out/blender_qc.json out/analysis_qc.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "3차 프리비즈 v2 통합 화면/카메라/3D 재검증" --notes "실제 1인 자세+합성 디지털 팬/줌/3초 컷. 2.5D 회색 배경판은 원본에서 추출했고, 미관측 영역은 실제 3D 가구로 복원하지 않았습니다. 다중 실제 인물 및 물리적 카메라 이동 완전 복원은 미검증." --latest=false --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto3-v2-batch-qa
          path: |
            out/*.mp4
            out/*.json
            out/*.blend
            out/*.jpg
            out/background_*.png
          retention-days: 1
          if-no-files-found: warn
