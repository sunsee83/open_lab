name: Mobile access to 3D previs - release assets
on:
  push:
    branches: [temp/previs-actual3d-20261101]
    paths: [.github/workflows/mobile-3d-preview-export.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-mobile-files:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified MP4 and Blender scene from previous run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming output
          gh run download 41221575482 --repo "$GITHUB_REPOSITORY" -n actual-3d-mannequin-proof -D incoming
          ls -lh incoming
          cp incoming/원본_실제3D_시점비교.mp4 output/preview_3d.mp4
          test -s output/preview_3d.mp4
          test -s incoming/3D_마네킹_편집가능.blend
      - name: Install Blender with headless graphics support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 libgl1 libgl1-mesa-dri xvfb xauth ffmpeg >/dev/null
          blender --version | head -1
      - name: Export Blender animation as a phone-viewable GLB
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/export_mobile_glb.py <<'PY'
          import bpy
          from pathlib import Path
          blend=Path('incoming/3D_마네킹_편집가능.blend').resolve()
          out=Path('output/animated_3d.glb').resolve()
          bpy.ops.wm.open_mainfile(filepath=str(blend))
          bpy.ops.export_scene.gltf(
              filepath=str(out),export_format='GLB',
              use_selection=False,export_animations=True,
              export_frame_range=True,export_cameras=False,
              export_lights=False,export_yup=True)
          print("MOBILE_GLB_EXPORTED",out,out.stat().st_size,flush=True)
          PY
          xvfb-run -a blender -b -t 2 --python /tmp/export_mobile_glb.py
          python3 - <<'PY'
          from pathlib import Path
          import struct,json
          p=Path('output/animated_3d.glb')
          data=p.read_bytes()
          assert len(data)>10000 and data[:4]==b'glTF', 'invalid glb file'
          version,total=struct.unpack_from('<II',data,4)
          assert version==2 and total==len(data)
          chunk_len,chunk_typ=struct.unpack_from('<I4s',data,12)
          assert chunk_typ==b'JSON'
          gltf=json.loads(data[20:20+chunk_len].decode('utf-8').rstrip(' \x00'))
          info={'bytes':len(data),'meshes':len(gltf.get('meshes',[])),'nodes':len(gltf.get('nodes',[])),'animations':len(gltf.get('animations',[])),'animation_channels':sum(len(a.get('channels',[])) for a in gltf.get('animations',[]))}
          assert info['meshes']>0 and info['animations']>0 and info['animation_channels']>0,'no usable 3d animation'
          Path('output/export_check.json').write_text(json.dumps(info,indent=2),encoding='utf8')
          print('REAL_MOBILE_3D_VERIFIED',json.dumps(info),flush=True)
          PY
          ffprobe -v error -show_entries format=duration,size -of json output/preview_3d.mp4
      - name: Publish direct downloadable temporary GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create previs-mobile-20261101 output/preview_3d.mp4 output/animated_3d.glb --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "모바일 3D 프리비즈 임시 결과" --notes "모바일용 실제 3D 애니메이션(GLB) 및 MP4. 본체 프리비즈 플러그인은 수정하지 않았습니다." --latest=false --prerelease
          gh release view previs-mobile-20261101 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile3d-access-test
          path: output/
          if-no-files-found: warn
          retention-days: 1
