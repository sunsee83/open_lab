name: Deploy YouTube Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'bookmarklets/youtube/apps-script/Code.gs'
      - 'bookmarklets/youtube/apps-script/Transport.gs'
      - 'bookmarklets/youtube/ui.html'
      - '.github/workflows/ytdl-apps-script-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-apps-script-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      DEPLOYMENT_ID: AKfycbxj-jUt6mYeQMKqIR5d0hloyP7NqbBlZUwjbmctPovwxmApqWuius0WGpdsn21aMuOx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check one-time Google credentials
        id: auth
        shell: bash
        run: |
          if [[ -n "$APPS_SCRIPT_ID" && -n "$CLASPRC_JSON" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Auto-deploy is waiting for GitHub Actions secrets APPS_SCRIPT_ID and CLASPRC_JSON.'
          fi

      - name: Setup Node
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.auth.outputs.ready == 'true'
        run: npm install --global @google/clasp@latest

      - name: Prepare authenticated Apps Script workspace
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          script_id = os.environ['APPS_SCRIPT_ID'].strip()
          auth = os.environ['CLASPRC_JSON'].strip()
          if not script_id:
              raise SystemExit('APPS_SCRIPT_ID is empty')
          json.loads(auth)

          Path.home().joinpath('.clasprc.json').write_text(auth + '\n', encoding='utf-8')
          work = Path('/tmp/ytdl-apps-script')
          work.mkdir(parents=True, exist_ok=True)
          work.joinpath('.clasp.json').write_text(
              json.dumps({'scriptId': script_id}, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          PY

          cd /tmp/ytdl-apps-script
          clasp pull

          cp "$GITHUB_WORKSPACE/bookmarklets/youtube/apps-script/Code.gs" Code.gs
          cp "$GITHUB_WORKSPACE/bookmarklets/youtube/apps-script/Transport.gs" Transport.gs
          cp "$GITHUB_WORKSPACE/bookmarklets/youtube/ui.html" ui.html

      - name: Validate before deployment
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          cp /tmp/ytdl-apps-script/Code.gs /tmp/ytdl-code.js
          cp /tmp/ytdl-apps-script/Transport.gs /tmp/ytdl-transport.js
          node --check /tmp/ytdl-code.js
          node --check /tmp/ytdl-transport.js

          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/ytdl-apps-script/ui.html').read_text(encoding='utf-8')
          start = s.find('<script>')
          end = s.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('ui.html script block not found')
          Path('/tmp/ytdl-ui.js').write_text(s[start + len('<script>'):end], encoding='utf-8')
          PY
          node --check /tmp/ytdl-ui.js

      - name: Push source to Apps Script
        if: steps.auth.outputs.ready == 'true'
        working-directory: /tmp/ytdl-apps-script
        run: clasp push --force

      - name: Update existing web app deployment
        if: steps.auth.outputs.ready == 'true'
        working-directory: /tmp/ytdl-apps-script
        shell: bash
        run: |
          clasp create-deployment \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "GitHub ${GITHUB_SHA::7}"
