name: Third-mode automatic scene camera cut pose to 3D
on:
  push:
    branches: [temp/previs-auto3-integrated-20261101]
    paths: [.github/workflows/previs-auto3-integrated-20261101.yml]
permissions:
  contents: write
jobs:
  auto3-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Receive independently prepared camera and pose test
        env:
          SOURCE_ARCHIVE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-04f0-8206-877e-e0aa91cf7fb0/raw?se=2026-10-31T17%3A42%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=ff38e4ee-375b-5964-bdf1-180d14f69c40&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T02%3A09%3A20Z&ske=2026-11-01T02%3A09%3A20Z&sks=b&skv=2026-02-06&sig=qVn1lA7%2BYWW6o2bXQEoAfOcY4DOr/DXyzEItjtRLHkA%3D"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/autopackage inputs output
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 100 --silent --show-error "$SOURCE_ARCHIVE_URL" -o /tmp/autopackage/package.tar.gz
          tar -xzf /tmp/autopackage/package.tar.gz -C /tmp/autopackage
          test -s /tmp/autopackage/skills/actions-video-transfer/assets/auto_previs.py
          cp /tmp/autopackage/skills/actions-video-transfer/assets/auto_previs.py ./auto_previs.py
          cp /tmp/autopackage/skills/actions-video-transfer/assets/blender_auto3.py ./blender_auto3.py
          cp /tmp/autopackage/skills/actions-video-transfer/assets/test_source.mp4 inputs/test_source.mp4
          cp /tmp/autopackage/skills/actions-video-transfer/assets/test_pose.json inputs/test_pose.json
          cp /tmp/autopackage/skills/actions-video-transfer/assets/synthetic_ground_truth.json inputs/ground_truth.json
          python -m py_compile auto_previs.py blender_auto3.py
          echo "TRANSFER_VALIDATED"
      - name: Install free headless Blender/OpenCV tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg blender xvfb xauth libegl1 libgl1 libgl1-mesa-dri python3-opencv python3-numpy >/dev/null
          blender --version | head -1
          /usr/bin/python3 -c 'import cv2,numpy; print("CV2_READY",cv2.__version__)'
      - name: Automatically analyze cut camera arrangement pose
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 auto_previs.py --video inputs/test_source.mp4 --pose-json inputs/test_pose.json --output output
          /usr/bin/python3 - <<'PY'
          import json,statistics
          a=json.load(open('output/auto_previs_spec.json'))
          g=json.load(open('inputs/ground_truth.json'))
          assert len(a['shots'])==2 and len(a['cuts'])==1 and abs(a['cuts'][0]-3)<0.15, a['cuts']
          assert a['pose_detection_frames']==a['total_frames']==48
          c=a['camera_keys'];valid=sum(v['quality']=='measured' for v in c)
          assert valid>=37, valid
          zoom_error=[]
          bg_motion_error=[]
          for i in range(1,48):
              if i==24 or c[i]['quality']!='measured': continue
              expected=g[i]['zoom']/g[0 if i<24 else 24]['zoom']
              zoom_error.append(abs(c[i]['apparent_zoom']-expected))
              bg_motion_error.append(abs(c[i]['screen_background_dx']-(g[i]['pan_x']-g[i-1]['pan_x'])))
          result={'actual_cut_sec':a['cuts'][0],'expected_cut_sec':3.0,'frames':48,'person_pose_frames':a['pose_detection_frames'],'camera_valid_frames':valid,'camera_zoom_mean_abs_error':round(statistics.mean(zoom_error),5),'background_pan_delta_median_abs_error_px':round(statistics.median(bg_motion_error),3),'source_has_synthetic_pan_zoom_and_cut':True}
          assert result['camera_zoom_mean_abs_error']<.015
          assert result['background_pan_delta_median_abs_error_px']<5.0
          open('output/validation.json','w').write(json.dumps(result,indent=2))
          print('CAMERA_CUT_POSE_QC_PASS',result)
          PY
      - name: Render actual 3D meshes with two moving Blender cameras
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python blender_auto3.py -- output/auto_previs_spec.json inputs/test_pose.json output
          test $(stat -c %s output/auto3_editable.blend) -gt 100000
          ffmpeg -nostdin -hide_banner -loglevel error -framerate 8 -start_number 1 -i output/render_front_%04d.png -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart -y output/3d_auto_front.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -framerate 8 -start_number 1 -i output/render_angle35_%04d.png -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart -y output/3d_auto_angle35.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -i inputs/test_source.mp4 -i output/3d_auto_front.mp4 -i output/3d_auto_angle35.mp4 -filter_complex "[0:v]scale=640:360,drawtext=text='SOURCE: SIMULATED PAN ZOOM CUT':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.7[v0];[1:v]drawtext=text='3D SCENE + CAMERA':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.7[v1];[2:v]drawtext=text='3D SIDE VIEW':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.7[v2];[v0][v1][v2]vstack=inputs=3[out]" -map "[out]" -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart output/auto3_mobile_comparison.mp4
          python3 - <<'PY'
          import subprocess,json
          p=subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=width,height,nb_frames','-show_entries','format=duration','-of','json','output/auto3_mobile_comparison.mp4'])
          print('RESULT_VIDEO_QC',p.decode())
          PY
          ls -lh output/*.mp4 output/*.blend output/*.json
      - name: Upload verified files to GitHub Release for Android MP4 direct access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create previs-auto3-development-20261101 output/auto3_mobile_comparison.mp4 output/3d_auto_front.mp4 output/auto_previs_spec.json output/validation.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "3차 프리비즈 자동 카메라 컷 3D 통합 검증" --notes "실제 1인 동작 데이터와 합성 디지털 팬/줌/컷으로 검증한 개발 단계 샘플. 실제 촬영 카메라 경로 재구성 완료가 아님." --latest=false --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto3-integrated-test-20261101
          path: |
            output/*.mp4
            output/*.blend
            output/*.json
            output/*.jpg
          if-no-files-found: warn
          retention-days: 1
