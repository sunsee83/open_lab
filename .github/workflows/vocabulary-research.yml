name: Elementary Vocabulary Research (10)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vocabulary-research.yml'

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vocabulary-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate pilot input and parser
        run: npm run check
      - name: Collect all Oxford senses for 10 words
        run: npm run collect
      - name: Upload public coverage metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-coverage-report
          path: |
            vocabulary-research/artifacts/public-coverage-report.json
            vocabulary-research/artifacts/public-coverage-report.md
          if-no-files-found: warn
          retention-days: 14
