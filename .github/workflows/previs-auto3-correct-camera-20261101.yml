name: Correct camera framing and publish auto3 mobile 3D comparison
on:
  push:
    branches: [temp/previs-auto3-integrated-20261101]
    paths: [.github/workflows/previs-auto3-correct-camera-20261101.yml]
permissions:
  contents: write
  actions: read
jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Recover earlier successfully rendered 3D working project
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 41225411939 --repo "$GITHUB_REPOSITORY" -n auto3-integrated-test-20261101 -D input
          test -s input/auto3_editable.blend
          test -s input/preview_comparison_raw.mp4
          cp input/validation.json output/validation.json
          cp input/auto_previs_spec.json output/auto_previs_spec.json
      - name: Set up Blender for fixing the verified framing error
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender xvfb xauth libegl1 libgl1 libgl1-mesa-dri ffmpeg >/dev/null
          blender --version | head -1
      - name: Correct all 3D camera scale keyframes, ground, and render
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix_auto3_cameras.py <<'PY'
          import bpy,os,json
          from pathlib import Path
          path=Path('input/auto3_editable.blend').resolve()
          bpy.ops.wm.open_mainfile(filepath=str(path))
          scene=bpy.context.scene
          aspect=960/540
          # Blender 4/5 both support scene evaluation and keyframe_insert.
          # Do not use Action.fcurves: layered actions no longer expose it.
          for f in range(1,49):
              scene.frame_set(f)
              for cam in bpy.data.cameras:
                  current_scale=float(cam.ortho_scale)
                  cam.ortho_scale=current_scale*aspect
                  cam.keyframe_insert(data_path='ortho_scale',frame=f)
          scene.frame_set(1)
          obj=bpy.data.objects.get('stage_floor')
          if obj:obj.location.z=-.47
          for x in bpy.data.objects:
              if x.name.startswith('floor_grid_'):x.location.z=-.42
          scene.render.resolution_x=640;scene.render.resolution_y=360
          bpy.ops.wm.save_as_mainfile(filepath=str(Path('output/auto3_corrected.blend').resolve()))
          cams=[('front','auto_camera_FRONT'),('angle35','inspect_camera_35deg')]
          for name,cam_name in cams:
              scene.camera=bpy.data.objects[cam_name]
              for f in range(1,49):
                  scene.frame_set(f)
                  scene.render.filepath=str(Path('output/render_'+name+'_%04d.png'%f).resolve())
                  bpy.ops.render.render(write_still=True)
          print('CORRECTED_SCENE_RENDERED',len(cams),48,'aspect',aspect,flush=True)
          PY
          xvfb-run -a blender -b -t 2 --python /tmp/fix_auto3_cameras.py
          ffmpeg -nostdin -hide_banner -loglevel error -framerate 8 -start_number 1 -i output/render_front_%04d.png -y -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p -movflags +faststart output/3d_auto_front_corrected.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -framerate 8 -start_number 1 -i output/render_angle35_%04d.png -y -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p -movflags +faststart output/3d_auto_angle35_corrected.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -i input/preview_comparison_raw.mp4 -vf 'crop=iw/3:ih:0:0,scale=640:360' -y -c:v libx264 -crf 24 -pix_fmt yuv420p -movflags +faststart output/auto3_test_source.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -i output/auto3_test_source.mp4 -i output/3d_auto_front_corrected.mp4 -i output/3d_auto_angle35_corrected.mp4 -filter_complex '[0:v][1:v][2:v]vstack=inputs=3[out]' -map '[out]' -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p -movflags +faststart output/auto3_mobile_comparison.mp4
          python3 - <<'PY'
          import json,subprocess
          res=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height,nb_frames','-show_entries','format=duration','-of','json','output/auto3_mobile_comparison.mp4']))
          st=res['streams'][0];d=float(res['format']['duration'])
          assert (st['width'],st['height'])==(640,1080) and abs(d-6)<.2 and st['codec_name']=='h264',res
          print('MOBILE_MP4_VERIFIED',json.dumps(res),flush=True)
          PY
          rm -f output/render_*.png
          ls -lh output/*.mp4 output/*.blend output/*.json
      - name: Publish direct mobile MP4 download and reusable 3D scene
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create previs-auto3-development-20261101 output/auto3_mobile_comparison.mp4 output/3d_auto_front_corrected.mp4 output/auto3_corrected.blend output/auto_previs_spec.json output/validation.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "3차 프리비즈 자동 카메라 컷 3D 통합 검증" --notes "1인 실제 관절 + 합성 디지털 카메라 팬/줌/컷. 분석·3D 카메라와 관절형 3D 시제품 검증이며 일반 실제 촬영의 모든 카메라/세트 복원을 보장하지 않음." --latest=false --prerelease
          gh release view previs-auto3-development-20261101 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto3-corrected-mobile-output
          path: |
            output/*.mp4
            output/*.blend
            output/*.json
          if-no-files-found: warn
          retention-days: 1
