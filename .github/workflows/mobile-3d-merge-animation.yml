name: Fix phone GLB to single full-body animation
on:
  push:
    branches: [temp/previs-actual3d-20261101]
    paths: [.github/workflows/mobile-3d-merge-animation.yml]
permissions:
  contents: write
  actions: read
jobs:
  merge-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve current GLB output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output
          gh run download 41222519257 --repo "$GITHUB_REPOSITORY" -n mobile3d-access-test -D input
          test -s input/animated_3d.glb
      - name: Merge per-part animations into one full-body clip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          raw=Path('input/animated_3d.glb').read_bytes()
          oldlen, typ=struct.unpack_from('<I4s',raw,12)
          assert typ==b'JSON'
          obj=json.loads(raw[20:20+oldlen])
          old=obj.pop('animations')
          combined_samplers=[];combined_channels=[];target_keys=set()
          for anim in old:
              off=len(combined_samplers)
              combined_samplers.extend(anim['samplers'])
              for channel in anim['channels']:
                  key=(channel['target']['node'],channel['target']['path'])
                  assert key not in target_keys, f'duplicate animated target: {key}'
                  target_keys.add(key)
                  combined_channels.append({**channel,'sampler':channel['sampler']+off})
          assert len(old)>1 and len(combined_channels)>10
          obj['animations']=[{'name':'FullBody_6s','samplers':combined_samplers,'channels':combined_channels}]
          jsonbytes=json.dumps(obj,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          jsonbytes+=b' '*((-len(jsonbytes))%4)
          remainder=raw[20+oldlen:]
          total=20+len(jsonbytes)+len(remainder)
          result=b'glTF'+struct.pack('<II',2,total)+struct.pack('<I4s',len(jsonbytes),b'JSON')+jsonbytes+remainder
          p=Path('output/animated_3d.glb');p.write_bytes(result)
          assert len(result)==total and result[:4]==b'glTF'
          data=json.loads(result[20:20+len(jsonbytes)])
          assert len(data['animations'])==1 and len(data['animations'][0]['channels'])==len(combined_channels)
          print('FULL_BODY_ONE_CLIP_OK',{'original_clips':len(old),'new_clips':1,'animation_channels':len(combined_channels),'mesh_count':len(data.get('meshes',[])),'bytes':p.stat().st_size})
          PY
      - name: Replace GitHub release file with fixed animated model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload previs-mobile-20261101 output/animated_3d.glb --clobber --repo "$GITHUB_REPOSITORY"
          gh release view previs-mobile-20261101 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
