name: Hypit sample analysis test
on:
  push:
    branches: ['temp/hypit-test-20261103']
permissions:
  contents: read
jobs:
  hypit-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Receive exact video without committing it
        env:
          TRANSFER_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3fc8-8206-bcc2-8f118d43fe65/raw?se=2026-11-02T18%3A22%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=49964053-52d4-52c4-887c-ca48ede1a8a9&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T23%3A44%3A30Z&ske=2026-11-02T23%3A44%3A30Z&sks=b&skv=2026-02-06&sig=RwTWbBIE%2Br8dmU4HHnzy2y1oFdzpQzPna6XwUvXoqFU%3D"
          EXPECTED_SHA256: 'd18ccc5a23092dacdcd4fe36af2f1c2d12fe345cdcde5d94999586227e003b64'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hypit-source" "$GITHUB_WORKSPACE/report"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 100 --silent --show-error "$TRANSFER_URL" -o "$RUNNER_TEMP/transfer.tar.gz"
          tar -xzf "$RUNNER_TEMP/transfer.tar.gz" -C "$RUNNER_TEMP/hypit-source"
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'hypit-source'
          found=list(root.rglob('hypit-test-videoplayback.mp4'))
          assert len(found)==1, f'Expected exactly one sample, found {len(found)}'
          digest=hashlib.sha256(found[0].read_bytes()).hexdigest()
          assert digest==os.environ['EXPECTED_SHA256'], f'SHA mismatch: {digest}'
          target=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'sample.mp4'
          shutil.copyfile(found[0],target)
          print('SOURCE_OK', digest, target.stat().st_size)
          PYCODE
      - name: Install official Hypit CLI
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/hypit-install" @hypit/hypit@0.3.1 --no-audit --no-fund --loglevel=warn
          "$RUNNER_TEMP/hypit-install/node_modules/.bin/hypit" --version 2>&1 | tee report/version.txt
      - name: Ensure FFmpeg and ffprobe installed
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          ffprobe -version | head -n 1
      - name: Run actual Hypit media analysis commands
        run: |
          set -euo pipefail
          HYPIT="$RUNNER_TEMP/hypit-install/node_modules/.bin/hypit"
          "$HYPIT" media probe sample.mp4 2>&1 | tee report/probe.txt
          "$HYPIT" media frames sample.mp4 --at 0.5,4,8,12,16,20 --to report/frames 2>&1 | tee report/frames.txt
          "$HYPIT" media boundaries sample.mp4 2>&1 | tee report/boundaries.txt
          echo 'HYPIT_SAMPLE_COMMANDS_OK'
      - name: Publish diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-sample-diagnostics
          path: report/
          if-no-files-found: warn
          retention-days: 1
